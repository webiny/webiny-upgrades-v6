name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"

      - name: Install
        run: yarn install --immutable

      - name: Typecheck
        run: yarn build

      - name: Dependency check
        run: yarn adio:check

      - name: Format
        run: yarn format:check

      - name: Lint
        run: yarn eslint

      - name: Test
        run: yarn test:coverage
